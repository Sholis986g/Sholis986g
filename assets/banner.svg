<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="1200" height="400">
  <defs>
    <!-- Gradients -->
    <linearGradient id="bannerGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#00D4FF;stop-opacity:0.1"/>
      <stop offset="50%" style="stop-color:#050816;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#0066FF;stop-opacity:0.05"/>
    </linearGradient>
    
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#00D4FF"/>
      <stop offset="100%" style="stop-color:#0066FF"/>
    </linearGradient>
    
    <filter id="softGlow">
      <feGaussianBlur stdDeviation="3"/>
      <feMerge>
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    
    <filter id="radarGlow">
      <feGaussianBlur stdDeviation="1"/>
      <feMerge>
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Radar pattern -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#00D4FF" stroke-width="0.3" opacity="0.08"/>
    </pattern>
  </defs>
  
  <!-- Background -->
  <rect width="1200" height="400" fill="#050816"/>
  <rect width="1200" height="400" fill="url(#grid)"/>
  
  <!-- Animated gradient overlay -->
  <rect width="1200" height="400" fill="url(#bannerGrad)">
    <animate attributeName="opacity" values="0.5;1;0.5" dur="8s" repeatCount="indefinite"/>
  </rect>
  
  <!-- Radar sweep -->
  <g transform="translate(1000, 300)">
    <circle cx="0" cy="0" r="80" fill="none" stroke="#00D4FF" stroke-width="0.5" opacity="0.2"/>
    <circle cx="0" cy="0" r="60" fill="none" stroke="#00D4FF" stroke-width="0.5" opacity="0.15"/>
    <circle cx="0" cy="0" r="40" fill="none" stroke="#00D4FF" stroke-width="0.5" opacity="0.1"/>
    <circle cx="0" cy="0" r="20" fill="none" stroke="#00D4FF" stroke-width="0.5" opacity="0.05"/>
    
    <!-- Sweep line -->
    <line x1="0" y1="0" x2="80" y2="0" stroke="#00D4FF" stroke-width="1" opacity="0.3" filter="url(#radarGlow)">
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="8s" repeatCount="indefinite"/>
    </line>
    
    <!-- Dots on radar -->
    <circle cx="30" cy="-20" r="2" fill="#00D4FF" opacity="0.6">
      <animate attributeName="opacity" values="0.2;1;0.2" dur="2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="-15" cy="35" r="1.5" fill="#00D4FF" opacity="0.4">
      <animate attributeName="opacity" values="0.1;0.8;0.1" dur="3s" repeatCount="indefinite"/>
    </circle>
    <circle cx="45" cy="15" r="1.5" fill="#00D4FF" opacity="0.5">
      <animate attributeName="opacity" values="0.3;0.9;0.3" dur="2.5s" repeatCount="indefinite"/>
    </circle>
  </g>
  
  <!-- Main content -->
  <text x="80" y="120" font-family="'Segoe UI', Arial, sans-serif" font-size="14" fill="#00D4FF" opacity="0.6" letter-spacing="4">SECURITY ENGINEER</text>
  
  <text x="80" y="175" font-family="'Segoe UI', Arial, sans-serif" font-size="56" font-weight="300" fill="#FFFFFF" letter-spacing="2">Ahmad Sholis</text>
  
  <text x="80" y="230" font-family="'Segoe UI', Arial, sans-serif" font-size="20" font-weight="300" fill="#8892B0" letter-spacing="1">Cyber Security & Full Stack Development</text>
  
  <!-- Status indicators -->
  <g transform="translate(80, 280)">
    <circle cx="0" cy="0" r="4" fill="#00D4FF" opacity="0.8">
      <animate attributeName="opacity" values="0.3;1;0.3" dur="2s" repeatCount="indefinite"/>
    </circle>
    <text x="15" y="5" font-family="'Segoe UI', Arial, sans-serif" font-size="12" fill="#00D4FF" opacity="0.7">ACTIVE</text>
    
    <circle cx="90" cy="0" r="3" fill="#FFFFFF" opacity="0.3"/>
    <text x="105" y="5" font-family="'Segoe UI', Arial, sans-serif" font-size="12" fill="#8892B0" opacity="0.6">SYSTEM SECURE</text>
  </g>
  
  <!-- Divider line -->
  <line x1="80" y1="260" x2="400" y2="260" stroke="url(#accentGrad)" stroke-width="1" opacity="0.3"/>
  
  <!-- Scanline effect -->
  <rect x="0" y="0" width="1200" height="2" fill="url(#accentGrad)" opacity="0.05">
    <animate attributeName="y" values="0;400;0" dur="6s" repeatCount="indefinite"/>
  </rect>
  
  <!-- Decorative dots -->
  <circle cx="1150" cy="50" r="1" fill="#00D4FF" opacity="0.3"/>
  <circle cx="1170" cy="80" r="1.5" fill="#00D4FF" opacity="0.2"/>
  <circle cx="1130" cy="100" r="1" fill="#00D4FF" opacity="0.15"/>
  
  <!-- Glitch effect lines -->
  <line x1="0" y1="150" x2="30" y2="150" stroke="#00D4FF" stroke-width="0.5" opacity="0.1">
    <animate attributeName="opacity" values="0;0.2;0" dur="3s" repeatCount="indefinite"/>
  </line>
  <line x1="0" y1="250" x2="50" y2="250" stroke="#00D4FF" stroke-width="0.5" opacity="0.1">
    <animate attributeName="opacity" values="0;0.15;0" dur="4s" repeatCount="indefinite"/>
  </line>
</svg>
