<svg width="1200" height="420" viewBox="0 0 1200 420" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg-grad" x1="0" y1="0" x2="1200" y2="420" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#060A1C"/>
      <stop offset="55%" stop-color="#050816"/>
      <stop offset="100%" stop-color="#040610"/>
    </linearGradient>

    <radialGradient id="glow-cyan" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#22D3EE" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#22D3EE" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="glow-blue" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#3B82F6" stop-opacity="0.28"/>
      <stop offset="100%" stop-color="#3B82F6" stop-opacity="0"/>
    </radialGradient>

    <pattern id="grid" width="36" height="36" patternUnits="userSpaceOnUse">
      <path d="M 36 0 L 0 0 0 36" fill="none" stroke="#1B2547" stroke-width="1"/>
    </pattern>

    <linearGradient id="scan-grad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#22D3EE" stop-opacity="0"/>
      <stop offset="50%" stop-color="#5EEAFF" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#22D3EE" stop-opacity="0"/>
    </linearGradient>

    <linearGradient id="text-glow" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#5EEAFF"/>
      <stop offset="55%" stop-color="#8FE9FF"/>
      <stop offset="100%" stop-color="#3B82F6"/>
    </linearGradient>

    <filter id="soft-blur" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="10"/>
    </filter>

    <clipPath id="frame-clip">
      <rect x="0" y="0" width="1200" height="420" rx="14"/>
    </clipPath>
  </defs>

  <g clip-path="url(#frame-clip)">
    <rect width="1200" height="420" fill="url(#bg-grad)"/>
    <rect width="1200" height="420" fill="url(#grid)" opacity="0.5"/>
    <circle cx="140" cy="80" r="260" fill="url(#glow-cyan)"/>
    <circle cx="1080" cy="360" r="300" fill="url(#glow-blue)"/>

    <!-- ambient scanline sweep -->
    <rect x="0" y="-140" width="1200" height="140" fill="url(#scan-grad)">
      <animate attributeName="y" values="-140;420" dur="6s" repeatCount="indefinite"/>
    </rect>

    <!-- outer frame -->
    <rect x="1" y="1" width="1198" height="418" rx="13" fill="none" stroke="#17233F" stroke-width="1.5"/>

    <!-- terminal title bar -->
    <rect x="1" y="1" width="1198" height="42" rx="13" fill="#080C20"/>
    <rect x="1" y="30" width="1198" height="13" fill="#080C20"/>
    <line x1="1" y1="43" x2="1199" y2="43" stroke="#161F3B" stroke-width="1"/>
    <circle cx="30" cy="21" r="5.5" fill="#FF5F57" opacity="0.85"/>
    <circle cx="50" cy="21" r="5.5" fill="#FEBC2E" opacity="0.85"/>
    <circle cx="70" cy="21" r="5.5" fill="#28C840" opacity="0.85"/>
    <text x="600" y="26" text-anchor="middle" font-family="ui-monospace,'SF Mono','JetBrains Mono',Consolas,monospace" font-size="13" fill="#6B7694" letter-spacing="1">ahmad@sholis  ~  /usr/bin/security-engineer  &#8212;  zsh</text>

    <!-- status pill -->
    <g transform="translate(1050,15)">
      <circle cx="0" cy="6" r="4" fill="#22D3EE">
        <animate attributeName="opacity" values="1;0.25;1" dur="1.8s" repeatCount="indefinite"/>
      </circle>
      <text x="12" y="10" font-family="ui-monospace,monospace" font-size="11" fill="#22D3EE" letter-spacing="1">ONLINE</text>
    </g>

    <!-- corner brackets -->
    <g stroke="#22D3EE" stroke-width="2" opacity="0.55">
      <path d="M 26 78 L 26 60 L 44 60" fill="none"/>
      <path d="M 1174 78 L 1174 60 L 1156 60" fill="none"/>
      <path d="M 26 372 L 26 390 L 44 390" fill="none"/>
      <path d="M 1174 372 L 1174 390 L 1156 390" fill="none"/>
    </g>

    <!-- eyebrow -->
    <text x="80" y="120" font-family="ui-monospace,'JetBrains Mono',monospace" font-size="14" fill="#3B82F6" letter-spacing="4">&#47;&#47; SECURE_PROFILE.INIT</text>

    <!-- name -->
    <text x="78" y="205" font-family="-apple-system,'SF Pro Display','Segoe UI',Helvetica,Arial,sans-serif" font-size="72" font-weight="700" fill="url(#text-glow)" letter-spacing="1">
      Ahmad Sholis
      <animate attributeName="opacity" values="0.4;1" dur="1.4s" begin="0s" fill="freeze"/>
    </text>
    <text x="80" y="205" font-family="-apple-system,'SF Pro Display','Segoe UI',Helvetica,Arial,sans-serif" font-size="72" font-weight="700" fill="url(#text-glow)" letter-spacing="1" filter="url(#soft-blur)" opacity="0.45">Ahmad Sholis</text>

    <!-- typing role rotator -->
    <g font-family="ui-monospace,'JetBrains Mono',Consolas,monospace" font-size="22" fill="#C7D3F5">
      <text x="80" y="248">
        <tspan>&gt;_ </tspan><tspan fill="#5EEAFF">Cyber Security Engineer</tspan>
        <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.02;0.08;0.23;0.25;1" dur="16s" repeatCount="indefinite"/>
      </text>
      <text x="80" y="248">
        <tspan>&gt;_ </tspan><tspan fill="#5EEAFF">Digital Forensics Enthusiast</tspan>
        <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.25;0.27;0.48;0.50;1" dur="16s" repeatCount="indefinite"/>
      </text>
      <text x="80" y="248">
        <tspan>&gt;_ </tspan><tspan fill="#5EEAFF">Full Stack Developer</tspan>
        <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.50;0.52;0.73;0.75;1" dur="16s" repeatCount="indefinite"/>
      </text>
      <text x="80" y="248">
        <tspan>&gt;_ </tspan><tspan fill="#5EEAFF">Graphic Designer</tspan>
        <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.75;0.77;0.98;1" dur="16s" repeatCount="indefinite"/>
      </text>
      <rect x="420" y="230" width="10" height="22" fill="#5EEAFF">
        <animate attributeName="opacity" values="1;1;0;0" dur="1s" repeatCount="indefinite"/>
      </rect>
    </g>

    <!-- tag row -->
    <g font-family="ui-monospace,monospace" font-size="12" fill="#8B96B8">
      <text x="80" y="300" letter-spacing="0.5">LINUX &#183; DOCKER &#183; LARAVEL &#183; PHP &#183; JAVASCRIPT &#183; MYSQL &#183; GIT &#183; WORDPRESS</text>
    </g>

    <!-- divider hairline -->
    <line x1="80" y1="322" x2="1120" y2="322" stroke="#16213E" stroke-width="1"/>

    <!-- footer strip inside banner -->
    <text x="80" y="360" font-family="ui-monospace,monospace" font-size="13" fill="#6B7694">based in Yogyakarta, Indonesia &#183; building secure systems &amp; clean interfaces</text>

    <!-- radar mini icon -->
    <g transform="translate(1120,355)" opacity="0.9">
      <circle r="26" fill="none" stroke="#17233F" stroke-width="1.5"/>
      <circle r="17" fill="none" stroke="#17233F" stroke-width="1"/>
      <circle r="8" fill="none" stroke="#17233F" stroke-width="1"/>
      <line x1="0" y1="0" x2="26" y2="0" stroke="#22D3EE" stroke-width="1.5" opacity="0.9">
        <animateTransform attributeName="transform" type="rotate" from="0 0 0" to="360 0 0" dur="3.5s" repeatCount="indefinite"/>
      </line>
      <path d="M 0 0 L 26 0 A 26 26 0 0 1 18.4 18.4 Z" fill="#22D3EE" opacity="0.18">
        <animateTransform attributeName="transform" type="rotate" from="0 0 0" to="360 0 0" dur="3.5s" repeatCount="indefinite"/>
      </path>
    </g>
  </g>
</svg>
