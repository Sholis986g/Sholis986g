<svg width="1200" height="32" viewBox="0 0 1200 32" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="d-line" x1="0" y1="0" x2="1200" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#050816" stop-opacity="0"/>
      <stop offset="12%" stop-color="#3B82F6" stop-opacity="0.55"/>
      <stop offset="50%" stop-color="#5EEAFF" stop-opacity="0.9"/>
      <stop offset="88%" stop-color="#3B82F6" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#050816" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="d-node-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#5EEAFF" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#5EEAFF" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <line x1="0" y1="16" x2="1200" y2="16" stroke="url(#d-line)" stroke-width="1.5"/>

  <g transform="translate(600,16)">
    <circle r="12" fill="url(#d-node-glow)">
      <animate attributeName="r" values="8;15;8" dur="3s" repeatCount="indefinite"/>
    </circle>
    <rect x="-4" y="-4" width="8" height="8" fill="#5EEAFF" transform="rotate(45)">
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="8s" repeatCount="indefinite"/>
    </rect>
  </g>

  <g transform="translate(120,16)" opacity="0.8">
    <circle r="2.5" fill="#22D3EE">
      <animate attributeName="opacity" values="0.2;1;0.2" dur="2.4s" repeatCount="indefinite"/>
    </circle>
  </g>
  <g transform="translate(1080,16)" opacity="0.8">
    <circle r="2.5" fill="#22D3EE">
      <animate attributeName="opacity" values="0.2;1;0.2" dur="2.4s" begin="1.2s" repeatCount="indefinite"/>
    </circle>
  </g>
</svg>
