<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 40" width="1200" height="40">
  <defs>
    <linearGradient id="dividerGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#00D4FF;stop-opacity:0"/>
      <stop offset="30%" style="stop-color:#00D4FF;stop-opacity:0.2"/>
      <stop offset="50%" style="stop-color:#00D4FF;stop-opacity:0.4"/>
      <stop offset="70%" style="stop-color:#00D4FF;stop-opacity:0.2"/>
      <stop offset="100%" style="stop-color:#00D4FF;stop-opacity:0"/>
    </linearGradient>
  </defs>
  
  <!-- Main divider -->
  <line x1="0" y1="20" x2="1200" y2="20" stroke="url(#dividerGrad)" stroke-width="1"/>
  
  <!-- Center diamond -->
  <rect x="595" y="13" width="10" height="10" transform="rotate(45 600 18)" fill="none" stroke="#00D4FF" stroke-width="0.5" opacity="0.5"/>
  
  <!-- Glow pulse -->
  <circle cx="600" cy="20" r="15" fill="#00D4FF" opacity="0.03">
    <animate attributeName="r" values="10;20;10" dur="3s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.05;0.01;0.05" dur="3s" repeatCount="indefinite"/>
  </circle>
  
  <!-- Small dots -->
  <circle cx="100" cy="20" r="1.5" fill="#00D4FF" opacity="0.15"/>
  <circle cx="1100" cy="20" r="1.5" fill="#00D4FF" opacity="0.15"/>
  
  <!-- Animated dots -->
  <circle cx="300" cy="20" r="1" fill="#00D4FF" opacity="0.1">
    <animate attributeName="opacity" values="0.05;0.2;0.05" dur="2s" repeatCount="indefinite"/>
  </circle>
  <circle cx="900" cy="20" r="1" fill="#00D4FF" opacity="0.1">
    <animate attributeName="opacity" values="0.05;0.2;0.05" dur="2.5s" repeatCount="indefinite"/>
  </circle>
</svg>
