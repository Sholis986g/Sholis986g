<svg width="160" height="160" viewBox="0 0 160 160" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="l-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#22D3EE" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#22D3EE" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="l-stroke" x1="0" y1="0" x2="160" y2="160" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#5EEAFF"/>
      <stop offset="100%" stop-color="#3B82F6"/>
    </linearGradient>
    <linearGradient id="l-text" x1="0" y1="0" x2="160" y2="160" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#F4F8FF"/>
      <stop offset="100%" stop-color="#8FE9FF"/>
    </linearGradient>
  </defs>

  <circle cx="80" cy="80" r="70" fill="url(#l-glow)">
    <animate attributeName="r" values="62;72;62" dur="3.2s" repeatCount="indefinite"/>
  </circle>

  <polygon points="80,10 141,45 141,115 80,150 19,115 19,45"
           fill="#080C20" stroke="url(#l-stroke)" stroke-width="2"/>

  <polygon points="80,24 129,52 129,108 80,136 31,108 31,52"
           fill="none" stroke="#17233F" stroke-width="1"/>

  <text x="80" y="98" text-anchor="middle" font-family="-apple-system,'SF Pro Display','Segoe UI',Helvetica,Arial,sans-serif" font-size="46" font-weight="700" fill="url(#l-text)">AS</text>

  <circle cx="80" cy="80" r="70" fill="none" stroke="#22D3EE" stroke-width="1" opacity="0.5">
    <animate attributeName="r" values="70;76;70" dur="2.6s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.5;0;0.5" dur="2.6s" repeatCount="indefinite"/>
  </circle>
</svg>
