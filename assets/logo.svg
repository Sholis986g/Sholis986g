<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <linearGradient id="logoGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#00D4FF;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0066FF;stop-opacity:1" />
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="2" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Hexagon background -->
  <polygon points="50,5 90,27 90,73 50,95 10,73 10,27" fill="none" stroke="url(#logoGradient)" stroke-width="2"/>
  
  <!-- Shield inner -->
  <polygon points="50,15 80,32 80,68 50,85 20,68 20,32" fill="none" stroke="url(#logoGradient)" stroke-width="1.5" opacity="0.5"/>
  
  <!-- S letter -->
  <text x="50" y="62" font-family="'Segoe UI', Arial, sans-serif" font-size="36" font-weight="700" fill="url(#logoGradient)" text-anchor="middle" filter="url(#glow)">S</text>
  
  <!-- Lock icon -->
  <rect x="38" y="45" width="24" height="16" rx="2" fill="none" stroke="#00D4FF" stroke-width="1.5"/>
  <path d="M44 45v-4c0-3.5 2.5-6 6-6s6 2.5 6 6v4" fill="none" stroke="#00D4FF" stroke-width="1.5"/>
  <circle cx="50" cy="53" r="2" fill="#00D4FF" opacity="0.8"/>
  
  <!-- Scanning line effect -->
  <rect x="20" y="70" width="60" height="1" fill="#00D4FF" opacity="0.3">
    <animate attributeName="y" values="15;85;15" dur="4s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.1;0.4;0.1" dur="4s" repeatCount="indefinite"/>
  </rect>
  
  <!-- Corner accents -->
  <circle cx="10" cy="10" r="2" fill="#00D4FF" opacity="0.5"/>
  <circle cx="90" cy="10" r="2" fill="#00D4FF" opacity="0.5"/>
  <circle cx="10" cy="90" r="2" fill="#00D4FF" opacity="0.5"/>
  <circle cx="90" cy="90" r="2" fill="#00D4FF" opacity="0.5"/>
</svg>
