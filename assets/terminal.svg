<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 200" width="400" height="200">
  <defs>
    <linearGradient id="termGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0A0A1A"/>
      <stop offset="100%" style="stop-color:#050816"/>
    </linearGradient>
    <filter id="termShadow">
      <feDropShadow dx="0" dy="4" stdDeviation="12" flood-color="#00D4FF" flood-opacity="0.05"/>
    </filter>
  </defs>
  
  <!-- Terminal frame -->
  <rect x="0" y="0" width="400" height="200" rx="8" fill="url(#termGrad)" stroke="#00D4FF" stroke-width="0.5" opacity="0.3" filter="url(#termShadow)"/>
  
  <!-- Window controls -->
  <circle cx="20" cy="20" r="6" fill="#FF5F57" opacity="0.5"/>
  <circle cx="40" cy="20" r="6" fill="#FFBD2E" opacity="0.5"/>
  <circle cx="60" cy="20" r="6" fill="#28C840" opacity="0.5"/>
  
  <!-- Title -->
  <text x="200" y="25" font-family="'Segoe UI', Arial, sans-serif" font-size="10" fill="#8892B0" opacity="0.5" text-anchor="middle">terminal — sholis@security</text>
  
  <!-- Terminal content -->
  <g transform="translate(20, 45)">
    <!-- Line 1 -->
    <text x="0" y="0" font-family="'Consolas', 'Courier New', monospace" font-size="12" fill="#00D4FF" opacity="0.6">$ whoami</text>
    <text x="0" y="25" font-family="'Consolas', 'Courier New', monospace" font-size="12" fill="#FFFFFF" opacity="0.8">ahmad sholis — security engineer</text>
    
    <!-- Line 2 -->
    <text x="0" y="55" font-family="'Consolas', 'Courier New', monospace" font-size="12" fill="#00D4FF" opacity="0.6">$ pwd</text>
    <text x="0" y="80" font-family="'Consolas', 'Courier New', monospace" font-size="12" fill="#FFFFFF" opacity="0.8">/home/security</text>
    
    <!-- Line 3 -->
    <text x="0" y="110" font-family="'Consolas', 'Courier New', monospace" font-size="12" fill="#00D4FF" opacity="0.6">$ skills</text>
    <text x="0" y="135" font-family="'Consolas', 'Courier New', monospace" font-size="12" fill="#FFFFFF" opacity="0.7">offensive security · forensics · full stack</text>
  </g>
  
  <!-- Scanning line -->
  <rect x="0" y="0" width="400" height="1" fill="#00D4FF" opacity="0.1">
    <animate attributeName="y" values="0;200;0" dur="4s" repeatCount="indefinite"/>
  </rect>
</svg>
