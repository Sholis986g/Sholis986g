<svg width="1200" height="200" viewBox="0 0 1200 200" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="f-bg" x1="0" y1="0" x2="1200" y2="200" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#050816"/>
      <stop offset="100%" stop-color="#070B1E"/>
    </linearGradient>
    <radialGradient id="f-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#3B82F6" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#3B82F6" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="radar-sweep" cx="0%" cy="0%" r="100%">
      <stop offset="0%" stop-color="#22D3EE" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#22D3EE" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="f-clip"><rect width="1200" height="200" rx="14"/></clipPath>
  </defs>

  <g clip-path="url(#f-clip)">
    <rect width="1200" height="200" fill="url(#f-bg)"/>
    <circle cx="1000" cy="40" r="220" fill="url(#f-glow)"/>
    <rect x="1" y="1" width="1198" height="198" rx="13" fill="none" stroke="#141B33" stroke-width="1.5"/>
    <line x1="0" y1="0" x2="1200" y2="0" stroke="#16213E" stroke-width="1"/>

    <!-- radar -->
    <g transform="translate(110,100)">
      <circle r="58" fill="none" stroke="#16213E" stroke-width="1"/>
      <circle r="40" fill="none" stroke="#16213E" stroke-width="1"/>
      <circle r="22" fill="none" stroke="#16213E" stroke-width="1"/>
      <line x1="-58" y1="0" x2="58" y2="0" stroke="#16213E" stroke-width="1"/>
      <line x1="0" y1="-58" x2="0" y2="58" stroke="#16213E" stroke-width="1"/>
      <g>
        <path d="M 0 0 L 58 0 A 58 58 0 0 1 41 41 Z" fill="url(#radar-sweep)"/>
        <line x1="0" y1="0" x2="58" y2="0" stroke="#5EEAFF" stroke-width="1.5"/>
        <animateTransform attributeName="transform" type="rotate" from="0 0 0" to="360 0 0" dur="4s" repeatCount="indefinite"/>
      </g>
      <circle cx="24" cy="-16" r="3" fill="#22D3EE">
        <animate attributeName="opacity" values="0;1;0" dur="4s" repeatCount="indefinite"/>
      </circle>
      <circle cx="-30" cy="20" r="3" fill="#22D3EE">
        <animate attributeName="opacity" values="0;1;0" dur="4s" begin="2s" repeatCount="indefinite"/>
      </circle>
      <circle r="3" fill="#5EEAFF"/>
    </g>

    <!-- signature text -->
    <text x="220" y="88" font-family="-apple-system,'SF Pro Display','Segoe UI',Helvetica,Arial,sans-serif" font-size="26" font-weight="600" fill="#E8ECF7">Thanks for stopping by.</text>
    <text x="220" y="118" font-family="ui-monospace,'JetBrains Mono',monospace" font-size="14" fill="#6B7694">Let&#8217;s build something secure, fast and well designed &#8212; together.</text>

    <!-- status line -->
    <g transform="translate(220,150)">
      <circle cx="0" cy="-4" r="4" fill="#22D3EE">
        <animate attributeName="opacity" values="1;0.3;1" dur="1.8s" repeatCount="indefinite"/>
      </circle>
      <text x="14" y="0" font-family="ui-monospace,monospace" font-size="12" fill="#8B96B8" letter-spacing="0.5">SYSTEM STATUS: ALL SERVICES OPERATIONAL &#183; UPTIME 99.98%</text>
    </g>

    <!-- scanline -->
    <rect x="0" y="-40" width="1200" height="40" fill="url(#f-glow)" opacity="0.5">
      <animate attributeName="y" values="-40;200" dur="5s" repeatCount="indefinite"/>
    </rect>

    <text x="1090" y="185" text-anchor="end" font-family="ui-monospace,monospace" font-size="11" fill="#3E4A70">&#169; 2026 Ahmad Sholis</text>
  </g>
</svg>
