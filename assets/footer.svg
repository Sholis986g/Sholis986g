<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 100" width="1200" height="100">
  <defs>
    <linearGradient id="footerGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#00D4FF;stop-opacity:0"/>
      <stop offset="50%" style="stop-color:#00D4FF;stop-opacity:0.1"/>
      <stop offset="100%" style="stop-color:#00D4FF;stop-opacity:0"/>
    </linearGradient>
  </defs>
  
  <!-- Top divider -->
  <line x1="0" y1="0" x2="1200" y2="0" stroke="url(#footerGrad)" stroke-width="1"/>
  
  <!-- Animated glow line -->
  <line x1="0" y1="0" x2="1200" y2="0" stroke="#00D4FF" stroke-width="0.5" opacity="0.1">
    <animate attributeName="opacity" values="0.05;0.2;0.05" dur="4s" repeatCount="indefinite"/>
  </line>
  
  <!-- Content -->
  <text x="600" y="35" font-family="'Segoe UI', Arial, sans-serif" font-size="12" fill="#8892B0" opacity="0.5" text-anchor="middle" letter-spacing="2">SYSTEM STATUS</text>
  
  <!-- Status indicators -->
  <g transform="translate(600, 55)">
    <rect x="-80" y="0" width="160" height="20" rx="10" fill="none" stroke="#00D4FF" stroke-width="0.5" opacity="0.1"/>
    
    <circle cx="-60" cy="10" r="3" fill="#00D4FF" opacity="0.6">
      <animate attributeName="opacity" values="0.3;1;0.3" dur="2s" repeatCount="indefinite"/>
    </circle>
    <text x="-50" y="14" font-family="'Segoe UI', Arial, sans-serif" font-size="10" fill="#8892B0" opacity="0.6">OPERATIONAL</text>
    
    <circle cx="20" cy="10" r="3" fill="#00D4FF" opacity="0.4">
      <animate attributeName="opacity" values="0.3;1;0.3" dur="2.5s" repeatCount="indefinite"/>
    </circle>
    <text x="30" y="14" font-family="'Segoe UI', Arial, sans-serif" font-size="10" fill="#8892B0" opacity="0.6">SECURE</text>
  </g>
  
  <!-- Copyright -->
  <text x="600" y="85" font-family="'Segoe UI', Arial, sans-serif" font-size="10" fill="#8892B0" opacity="0.3" text-anchor="middle">© 2026 Ahmad Sholis · Built with precision</text>
  
  <!-- Decorative dots -->
  <circle cx="100" cy="50" r="1" fill="#00D4FF" opacity="0.1">
    <animate attributeName="opacity" values="0.05;0.15;0.05" dur="3s" repeatCount="indefinite"/>
  </circle>
  <circle cx="1100" cy="50" r="1" fill="#00D4FF" opacity="0.1">
    <animate attributeName="opacity" values="0.05;0.15;0.05" dur="3.5s" repeatCount="indefinite"/>
  </circle>
</svg>
