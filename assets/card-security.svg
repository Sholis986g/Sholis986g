<svg width="380" height="440" viewBox="0 0 380 440" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="c1-bg" x1="0" y1="0" x2="380" y2="440" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#080C20"/>
      <stop offset="100%" stop-color="#060915"/>
    </linearGradient>
    <linearGradient id="c1-top" x1="0" y1="0" x2="380" y2="0">
      <stop offset="0%" stop-color="#22D3EE" stop-opacity="0"/>
      <stop offset="50%" stop-color="#5EEAFF" stop-opacity="1"/>
      <stop offset="100%" stop-color="#22D3EE" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="c1-clip"><rect width="380" height="440" rx="14"/></clipPath>
  </defs>

  <g clip-path="url(#c1-clip)">
    <rect width="380" height="440" fill="url(#c1-bg)"/>
    <rect x="1" y="1" width="378" height="438" rx="13" fill="none" stroke="#16213E" stroke-width="1.5"/>
    <rect x="0" y="0" width="380" height="3" fill="url(#c1-top)">
      <animate attributeName="opacity" values="0.5;1;0.5" dur="2.6s" repeatCount="indefinite"/>
    </rect>

    <!-- corner ticks -->
    <g stroke="#22D3EE" stroke-width="1.5" opacity="0.6">
      <path d="M14 30 V16 H28" fill="none"/>
      <path d="M366 30 V16 H352" fill="none"/>
    </g>

    <!-- index tag -->
    <text x="24" y="50" font-family="ui-monospace,'JetBrains Mono',monospace" font-size="12" fill="#3B82F6" letter-spacing="2">CATEGORY_01</text>

    <!-- icon -->
    <g transform="translate(24,66)">
      <path d="M20 0 L38 8 V24 C38 36 30 43 20 47 C10 43 2 36 2 24 V8 Z" fill="none" stroke="#22D3EE" stroke-width="2"/>
      <path d="M12 24 L17 29 L28 16" fill="none" stroke="#5EEAFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    </g>

    <!-- title -->
    <text x="24" y="150" font-family="-apple-system,'SF Pro Display','Segoe UI',sans-serif" font-size="21" font-weight="700" fill="#E8ECF7">Security &amp; Forensics</text>
    <text x="24" y="150" font-family="-apple-system,'SF Pro Display','Segoe UI',sans-serif" font-size="21" font-weight="700" fill="#5EEAFF" opacity="0.35">Security &amp; Forensics</text>
    <text x="24" y="174" font-family="ui-monospace,monospace" font-size="12" fill="#6B7694">/toolkit &#8594; hardening &amp; incident-response</text>

    <!-- description -->
    <text font-family="-apple-system,'Segoe UI',sans-serif" font-size="13.5" fill="#AAB4D4">
      <tspan x="24" y="210">Scripts and playbooks for Linux</tspan>
      <tspan x="24" y="232">hardening, log analysis and</tspan>
      <tspan x="24" y="254">incident triage &#8212; built around</tspan>
      <tspan x="24" y="276">containerised, repeatable workflows.</tspan>
    </text>

    <!-- tag chips -->
    <g font-family="ui-monospace,monospace" font-size="11" fill="#8FE9FF">
      <rect x="24" y="298" width="58" height="24" rx="6" fill="#0D1329" stroke="#16213E"/>
      <text x="53" y="314" text-anchor="middle">Linux</text>
      <rect x="90" y="298" width="66" height="24" rx="6" fill="#0D1329" stroke="#16213E"/>
      <text x="123" y="314" text-anchor="middle">Docker</text>
      <rect x="164" y="298" width="90" height="24" rx="6" fill="#0D1329" stroke="#16213E"/>
      <text x="209" y="314" text-anchor="middle">Automation</text>
      <rect x="262" y="298" width="94" height="24" rx="6" fill="#0D1329" stroke="#16213E"/>
      <text x="309" y="314" text-anchor="middle">Forensics</text>
    </g>

    <line x1="24" y1="352" x2="356" y2="352" stroke="#16213E" stroke-width="1"/>

    <g transform="translate(24,372)">
      <circle cx="6" cy="0" r="4" fill="#22D3EE">
        <animate attributeName="opacity" values="1;0.3;1" dur="1.8s" repeatCount="indefinite"/>
      </circle>
      <text x="18" y="4" font-family="ui-monospace,monospace" font-size="11" fill="#6B7694">status: actively maintained</text>
    </g>

    <g transform="translate(300,364)">
