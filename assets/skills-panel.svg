<svg width="1200" height="500" viewBox="0 0 1200 500" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="s-bg" x1="0" y1="0" x2="1200" y2="500" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#060A1C"/>
      <stop offset="100%" stop-color="#050816"/>
    </linearGradient>
    <linearGradient id="bar-grad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#3B82F6"/>
      <stop offset="100%" stop-color="#5EEAFF"/>
    </linearGradient>
    <pattern id="grid-ref" width="36" height="36" patternUnits="userSpaceOnUse">
      <path d="M 36 0 L 0 0 0 36" fill="none" stroke="#111832" stroke-width="1"/>
    </pattern>
    <clipPath id="s-clip"><rect width="1200" height="500" rx="14"/></clipPath>
  </defs>

  <g clip-path="url(#s-clip)">
    <rect width="1200" height="500" fill="url(#s-bg)"/>
    <rect width="1200" height="500" fill="url(#grid-ref)"/>
    <rect x="1" y="1" width="1198" height="498" rx="13" fill="none" stroke="#141B33" stroke-width="1.5"/>

    <!-- title bar -->
    <rect x="1" y="1" width="1198" height="42" rx="13" fill="#080C20"/>
    <rect x="1" y="30" width="1198" height="13" fill="#080C20"/>
    <line x1="1" y1="43" x2="1199" y2="43" stroke="#161F3B" stroke-width="1"/>
    <circle cx="30" cy="21" r="5.5" fill="#FF5F57" opacity="0.85"/>
    <circle cx="50" cy="21" r="5.5" fill="#FEBC2E" opacity="0.85"/>
    <circle cx="70" cy="21" r="5.5" fill="#28C840" opacity="0.85"/>
    <text x="600" y="26" text-anchor="middle" font-family="ui-monospace,'JetBrains Mono',monospace" font-size="13" fill="#6B7694" letter-spacing="1">~ &#8594; skills --list --verbose</text>

    <!-- ===== Panel template repeated x4 via groups ===== -->

    <!-- 1. Security & Systems -->
    <g transform="translate(40,68)">
      <rect width="540" height="190" rx="10" fill="#080C20" stroke="#16213E" stroke-width="1"/>
      <g transform="translate(22,22)">
        <path d="M14 0 L27 6 V16 C27 26 21 32 14 35 C7 32 1 26 1 16 V6 Z" fill="none" stroke="#22D3EE" stroke-width="2"/>
        <path d="M8 17 L12 21 L20 12" fill="none" stroke="#5EEAFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      </g>
      <text x="60" y="38" font-family="-apple-system,'SF Pro Display','Segoe UI',sans-serif" font-size="18" font-weight="600" fill="#E8ECF7">Security &amp; Systems</text>
      <text x="22" y="70" font-family="ui-monospace,monospace" font-size="12" fill="#6B7694">core competencies</text>

      <g font-family="ui-monospace,monospace" font-size="12" fill="#C7D3F5">
        <!-- rows: label, bar -->
        <text x="22" y="98">Linux Administration</text>
        <rect x="330" y="88" width="180" height="6" rx="3" fill="#111832"/>
        <rect x="330" y="88" width="164" height="6" rx="3" fill="url(#bar-grad)"/>

        <text x="22" y="126">Docker &amp; Containers</text>
        <rect x="330" y="116" width="180" height="6" rx="3" fill="#111832"/>
        <rect x="330" y="116" width="150" height="6" rx="3" fill="url(#bar-grad)"/>

        <text x="22" y="154">Digital Forensics</text>
        <rect x="330" y="144" width="180" height="6" rx="3" fill="#111832"/>
        <rect x="330" y="144" width="140" height="6" rx="3" fill="url(#bar-grad)"/>

        <text x="22" y="182">Secure Architecture</text>
        <rect x="330" y="172" width="180" height="6" rx="3" fill="#111832"/>
        <rect x="330" y="172" width="156" height="6" rx="3" fill="url(#bar-grad)"/>
      </g>
    </g>

    <!-- 2. Development -->
    <g transform="translate(620,68)">
      <rect width="540" height="190" rx="10" fill="#080C20" stroke="#16213E" stroke-width="1"/>
      <g transform="translate(22,22)" font-family="ui-monospace,monospace" font-size="20" fill="#22D3EE" font-weight="700">
        <text x="0" y="26">&lt;/&gt;</text>
      </g>
      <text x="60" y="38" font-family="-apple-system,'SF Pro Display','Segoe UI',sans-serif" font-size="18" font-weight="600" fill="#E8ECF7">Development</text>
      <text x="22" y="70" font-family="ui-monospace,monospace" font-size="12" fill="#6B7694">full stack toolkit</text>

      <g font-family="ui-monospace,monospace" font-size="12" fill="#C7D3F5">
        <g transform="translate(22,88)">
          <rect width="82" height="26" rx="6" fill="#0D1329" stroke="#22D3EE" stroke-width="1"/>
          <text x="41" y="17" text-anchor="middle" fill="#8FE9FF">PHP</text>
        </g>
        <g transform="translate(112,88)">
          <rect width="98" height="26" rx="6" fill="#0D1329" stroke="#22D3EE" stroke-width="1"/>
          <text x="49" y="17" text-anchor="middle" fill="#8FE9FF">Laravel</text>
        </g>
        <g transform="translate(218,88)">
          <rect width="130" height="26" rx="6" fill="#0D1329" stroke="#22D3EE" stroke-width="1"/>
          <text x="65" y="17" text-anchor="middle" fill="#8FE9FF">JavaScript</text>
        </g>
        <g transform="translate(356,88)">
          <rect width="98" height="26" rx="6" fill="#0D1329" stroke="#22D3EE" stroke-width="1"/>
          <text x="49" y="17" text-anchor="middle" fill="#8FE9FF">MySQL</text>
        </g>

        <g transform="translate(22,126)">
          <rect width="76" height="26" rx="6" fill="#0D1329" stroke="#3B82F6" stroke-width="1"/>
          <text x="38" y="17" text-anchor="middle" fill="#8FE9FF">Git</text>
        </g>
        <g transform="translate(106,126)">
          <rect width="130" height="26" rx="6" fill="#0D1329" stroke="#3B82F6" stroke-width="1"/>
          <text x="65" y="17" text-anchor="middle" fill="#8FE9FF">WordPress</text>
        </g>
        <g transform="translate(244,126)">
          <rect width="98" height="26" rx="6" fill="#0D1329" stroke="#3B82F6" stroke-width="1"/>
          <text x="49" y="17" text-anchor="middle" fill="#8FE9FF">Docker</text>
        </g>
        <g transform="translate(350,126)">
          <rect width="104" height="26" rx="6" fill="#0D1329" stroke="#3B82F6" stroke-width="1"/>
          <text x="52" y="17" text-anchor="middle" fill="#8FE9FF">REST API</text>
        </g>

        <text x="22" y="176" fill="#6B7694">$ building reliable, maintainable web systems_</text>
        <rect x="352" y="164" width="8" height="14" fill="#5EEAFF">
          <animate attributeName="opacity" values="1;0;1" dur="1s" repeatCount="indefinite"/>
        </rect>
      </g>
    </g>

    <!-- 3. Design -->
    <g transform="translate(40,278)">
      <rect width="540" height="190" rx="10" fill="#080C20" stroke="#16213E" stroke-width="1"/>
      <g transform="translate(22,20)">
        <rect x="0" y="8" width="20" height="20" rx="2" fill="none" stroke="#3B82F6" stroke-width="2"/>
        <rect x="7" y="0" width="20" height="20" rx="2" fill="none" stroke="#22D3EE" stroke-width="2"/>
      </g>
      <text x="60" y="38" font-family="-apple-system,'SF Pro Display','Segoe UI',sans-serif" font-size="18" font-weight="600" fill="#E8ECF7">Graphic Design</text>
      <text x="22" y="70" font-family="ui-monospace,monospace" font-size="12" fill="#6B7694">visual craft</text>

      <g font-family="ui-monospace,monospace" font-size="12" fill="#C7D3F5">
        <g transform="translate(22,88)">
          <circle cx="6" cy="10" r="4" fill="#5EEAFF"/>
          <text x="18" y="14">Adobe Photoshop</text>
        </g>
        <g transform="translate(22,114)">
          <circle cx="6" cy="10" r="4" fill="#5EEAFF"/>
          <text x="18" y="14">Adobe Illustrator</text>
        </g>
        <g transform="translate(22,140)">
          <circle cx="6" cy="10" r="4" fill="#5EEAFF"/>
          <text x="18" y="14">Figma</text>
        </g>
        <g transform="translate(280,88)">
          <circle cx="6" cy="10" r="4" fill="#3B82F6"/>
          <text x="18" y="14">Canva</text>
        </g>
        <g transform="translate(280,114)">
          <circle cx="6" cy="10" r="4" fill="#3B82F6"/>
          <text x="18" y="14">Lightroom</text>
        </g>
        <g transform="translate(280,140)">
          <circle cx="6" cy="10" r="4" fill="#3B82F6"/>
          <text x="18" y="14">Photography</text>
        </g>
      </g>
      <text x="22" y="176" font-family="ui-monospace,monospace" font-size="11" fill="#6B7694">visual identity, layout &amp; photo retouch</text>
    </g>

    <!-- 4. Focus / Interests -->
    <g transform="translate(620,278)">
      <rect width="540" height="190" rx="10" fill="#080C20" stroke="#16213E" stroke-width="1"/>
      <g transform="translate(22,20)">
        <circle cx="14" cy="14" r="13" fill="none" stroke="#22D3EE" stroke-width="2"/>
        <circle cx="14" cy="14" r="3.4" fill="#5EEAFF"/>
        <line x1="14" y1="0" x2="14" y2="5" stroke="#22D3EE" stroke-width="2"/>
        <line x1="14" y1="23" x2="14" y2="28" stroke="#22D3EE" stroke-width="2"/>
      </g>
      <text x="60" y="38" font-family="-apple-system,'SF Pro Display','Segoe UI',sans-serif" font-size="18" font-weight="600" fill="#E8ECF7">Current Focus</text>
      <text x="22" y="70" font-family="ui-monospace,monospace" font-size="12" fill="#6B7694">what I&#8217;m exploring</text>

      <g font-family="ui-monospace,monospace" font-size="12" fill="#C7D3F5">
        <text x="22" y="96">01  Automation &amp; scripting for ops</text>
        <text x="22" y="120">02  Secure system architecture</text>
        <text x="22" y="144">03  Photography &amp; visual storytelling</text>
        <text x="22" y="168">04  Applied digital forensics</text>
      </g>
    </g>
  </g>
</svg>
