<svg width="1200" height="230" viewBox="0 0 1200 230" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="m-bg" x1="0" y1="0" x2="1200" y2="230" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#060A1C"/>
      <stop offset="100%" stop-color="#050816"/>
    </linearGradient>
    <linearGradient id="m-bar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#3B82F6"/>
      <stop offset="100%" stop-color="#5EEAFF"/>
    </linearGradient>
    <clipPath id="m-clip"><rect width="1200" height="230" rx="14"/></clipPath>
  </defs>

  <g clip-path="url(#m-clip)">
    <rect width="1200" height="230" fill="url(#m-bg)"/>
    <rect x="1" y="1" width="1198" height="228" rx="13" fill="none" stroke="#141B33" stroke-width="1.5"/>

    <rect x="1" y="1" width="1198" height="42" rx="13" fill="#080C20"/>
    <rect x="1" y="30" width="1198" height="13" fill="#080C20"/>
    <line x1="1" y1="43" x2="1199" y2="43" stroke="#161F3B" stroke-width="1"/>
    <circle cx="30" cy="21" r="5.5" fill="#FF5F57" opacity="0.85"/>
    <circle cx="50" cy="21" r="5.5" fill="#FEBC2E" opacity="0.85"/>
    <circle cx="70" cy="21" r="5.5" fill="#28C840" opacity="0.85"/>
    <text x="600" y="26" text-anchor="middle" font-family="ui-monospace,'JetBrains Mono',monospace" font-size="13" fill="#6B7694" letter-spacing="1">~ &#8594; profile --activity</text>

    <!-- decorative activity grid (illustrative, not literal contribution data) -->
    <g transform="translate(40,66)">
      <text x="0" y="0" font-family="ui-monospace,monospace" font-size="12" fill="#6B7694">activity pattern</text>
      <g transform="translate(0,14)">
        <!-- 13 columns x 7 rows of pulse squares -->
      </g>
    </g>

    <g font-family="ui-monospace,monospace" font-size="11" fill="#3B82F6">
      <text x="1160" y="90" text-anchor="end">live GitHub stats currently unavailable</text>
      <text x="1160" y="106" text-anchor="end" fill="#6B7694">see github.com/Sholis986g for up-to-date activity</text>
    </g>

    <line x1="40" y1="126" x2="1160" y2="126" stroke="#16213E" stroke-width="1"/>

    <g font-family="-apple-system,'Segoe UI',sans-serif" font-size="13" fill="#AAB4D4">
      <text x="40" y="156">Focus areas</text>
    </g>

    <g font-family="ui-monospace,monospace" font-size="12" fill="#C7D3F5">
      <text x="40" y="182">Security &amp; Systems</text>
      <rect x="220" y="172" width="240" height="6" rx="3" fill="#111832"/>
      <rect x="220" y="172" width="200" height="6" rx="3" fill="url(#m-bar)"/>

      <text x="500" y="182">Full Stack Dev</text>
      <rect x="660" y="172" width="240" height="6" rx="3" fill="#111832"/>
      <rect x="660" y="172" width="220" height="6" rx="3" fill="url(#m-bar)"/>

      <text x="40" y="210">Visual Design</text>
      <rect x="220" y="200" width="240" height="6" rx="3" fill="#111832"/>
      <rect x="220" y="200" width="150" height="6" rx="3" fill="url(#m-bar)"/>

      <text x="500" y="210">Automation</text>
      <rect x="660" y="200" width="240" height="6" rx="3" fill="#111832"/>
      <rect x="660" y="200" width="170" height="6" rx="3" fill="url(#m-bar)"/>
    </g>
  </g>
</svg>
