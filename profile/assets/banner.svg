<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 200" width="1000" height="200">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#050816"/>
      <stop offset="100%" style="stop-color:#0A0A1A"/>
    </linearGradient>
    <linearGradient id="line" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#00D4FF;stop-opacity:0"/>
      <stop offset="50%" style="stop-color:#00D4FF;stop-opacity:0.3"/>
      <stop offset="100%" style="stop-color:#00D4FF;stop-opacity:0"/>
    </linearGradient>
  </defs>
  
  <rect width="1000" height="200" fill="url(#bg)"/>
  
  <!-- Top accent line -->
  <rect x="0" y="0" width="1000" height="1" fill="url(#line)"/>
  
  <!-- Content -->
  <g transform="translate(60, 50)">
    <text x="0" y="0" font-family="'Segoe UI', Arial, sans-serif" font-size="12" fill="#00D4FF" opacity="0.5" letter-spacing="3">SECURITY ENGINEER</text>
    <text x="0" y="40" font-family="'Segoe UI', Arial, sans-serif" font-size="44" font-weight="300" fill="#FFFFFF">Ahmad Sholis</text>
    <text x="0" y="70" font-family="'Segoe UI', Arial, sans-serif" font-size="16" font-weight="300" fill="#8892B0">Cyber Security & Full Stack Developer</text>
    
    <!-- Status dot -->
    <g transform="translate(0, 100)">
      <circle cx="0" cy="0" r="3" fill="#00D4FF">
        <animate attributeName="opacity" values="0.3;1;0.3" dur="2s" repeatCount="indefinite"/>
      </circle>
      <text x="12" y="4" font-family="'Segoe UI', Arial, sans-serif" font-size="11" fill="#00D4FF" opacity="0.4">ACTIVE</text>
      <text x="70" y="4" font-family="'Segoe UI', Arial, sans-serif" font-size="11" fill="#8892B0" opacity="0.3">● SECURE</text>
    </g>
  </g>
  
  <!-- Small decoration right -->
  <g transform="translate(880, 140)">
    <circle cx="0" cy="0" r="30" fill="none" stroke="#00D4FF" stroke-width="0.3" opacity="0.08"/>
    <circle cx="0" cy="0" r="15" fill="none" stroke="#00D4FF" stroke-width="0.3" opacity="0.05"/>
  </g>
  
  <!-- Bottom accent line -->
  <rect x="0" y="199" width="1000" height="1" fill="url(#line)"/>
</svg>
