<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 280" width="1200" height="280">
  <defs>
    <linearGradient id="bannerBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#050816"/>
      <stop offset="100%" style="stop-color:#0A0A1A"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#00D4FF;stop-opacity:0"/>
      <stop offset="50%" style="stop-color:#00D4FF;stop-opacity:0.15"/>
      <stop offset="100%" style="stop-color:#00D4FF;stop-opacity:0"/>
    </linearGradient>
  </defs>
  
  <rect width="1200" height="280" fill="url(#bannerBg)"/>
  
  <!-- Subtle grid -->
  <pattern id="grid" width="60" height="60" patternUnits="userSpaceOnUse">
    <path d="M 60 0 L 0 0 0 60" fill="none" stroke="#00D4FF" stroke-width="0.3" opacity="0.04"/>
  </pattern>
  <rect width="1200" height="280" fill="url(#grid)"/>
  
  <!-- Accent line top -->
  <rect x="0" y="0" width="1200" height="1" fill="url(#accent)"/>
  
  <!-- Main content -->
  <g transform="translate(80, 60)">
    <text x="0" y="0" font-family="'Segoe UI', Arial, sans-serif" font-size="13" fill="#00D4FF" opacity="0.5" letter-spacing="4">SECURITY ENGINEER</text>
    <text x="0" y="45" font-family="'Segoe UI', Arial, sans-serif" font-size="52" font-weight="300" fill="#FFFFFF" letter-spacing="1">Ahmad Sholis</text>
    <text x="0" y="80" font-family="'Segoe UI', Arial, sans-serif" font-size="18" font-weight="300" fill="#8892B0" letter-spacing="0.5">Cyber Security & Full Stack Development</text>
    
    <!-- Status -->
    <g transform="translate(0, 120)">
      <circle cx="0" cy="0" r="3" fill="#00D4FF" opacity="0.6">
        <animate attributeName="opacity" values="0.3;1;0.3" dur="2s" repeatCount="indefinite"/>
      </circle>
      <text x="12" y="4" font-family="'Segoe UI', Arial, sans-serif" font-size="11" fill="#00D4FF" opacity="0.5">ACTIVE</text>
      
      <rect x="80" y="-8" width="1" height="16" fill="#00D4FF" opacity="0.1"/>
      
      <text x="95" y="4" font-family="'Segoe UI', Arial, sans-serif" font-size="11" fill="#8892B0" opacity="0.4">● SYSTEM SECURE</text>
    </g>
  </g>
  
  <!-- Right side - minimal decoration -->
  <g transform="translate(1000, 180)">
    <circle cx="0" cy="0" r="40" fill="none" stroke="#00D4FF" stroke-width="0.3" opacity="0.1"/>
    <circle cx="0" cy="0" r="25" fill="none" stroke="#00D4FF" stroke-width="0.3" opacity="0.08"/>
    <circle cx="0" cy="0" r="10" fill="none" stroke="#00D4FF" stroke-width="0.3" opacity="0.05"/>
    
    <!-- Radar line -->
    <line x1="0" y1="0" x2="40" y2="0" stroke="#00D4FF" stroke-width="0.5" opacity="0.15">
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="10s" repeatCount="indefinite"/>
    </line>
  </g>
  
  <!-- Accent line bottom -->
  <rect x="0" y="279" width="1200" height="1" fill="url(#accent)"/>
</svg>
