<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 80 80" width="80" height="80">
  <defs>
    <linearGradient id="logoGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#00D4FF"/>
      <stop offset="100%" style="stop-color:#0066FF"/>
    </linearGradient>
  </defs>
  
  <!-- Hexagon -->
  <polygon points="40,5 72,23 72,57 40,75 8,57 8,23" fill="none" stroke="url(#logoGrad)" stroke-width="1.5"/>
  
  <!-- Inner shield -->
  <polygon points="40,18 62,32 62,56 40,70 18,56 18,32" fill="none" stroke="url(#logoGrad)" stroke-width="1" opacity="0.4"/>
  
  <!-- S letter -->
  <text x="40" y="50" font-family="'Segoe UI', Arial, sans-serif" font-size="32" font-weight="300" fill="url(#logoGrad)" text-anchor="middle">S</text>
  
  <!-- Small lock -->
  <rect x="34" y="40" width="12" height="8" rx="1" fill="none" stroke="#00D4FF" stroke-width="1.2" opacity="0.6"/>
  <path d="M38 40v-3c0-2 1.5-3.5 3.5-3.5s3.5 1.5 3.5 3.5v3" fill="none" stroke="#00D4FF" stroke-width="1.2" opacity="0.6"/>
</svg>
